title = "NAD secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Generated public contract SHA-256 lock values"
  paths = [
    '''src/lib/modules/contracts/v[12]/(contract-lock|generated-lock)\.generated\.json$''',
    '''src/lib/modules/contracts/v[12]/schemas\.generated\.ts$''',
  ]
