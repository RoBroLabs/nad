name: Release gate

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: Install Deno 2.7.7
        run: |
          bash scripts/ci-install-deno.sh
          echo "$PWD/.ci-tools" >> "$GITHUB_PATH"
      - name: Complete source gate
        run: pnpm ci:gate

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dependency-complete browser gate
        run: docker build --network host --target browser-gate --tag nad-browser-gate .
      - name: Run browser release gate
        run: docker run --rm --network host nad-browser-gate

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 git --config=/repo/.gitleaks.toml --no-banner --redact /repo

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            machine: x86_64
            tag: amd64
            test_timeout_ms: 5000
            hook_timeout_ms: 10000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build release gate
        run: docker buildx build --load --platform "${{ matrix.platform }}" --target release-gate --tag "nad-release-gate:${{ matrix.tag }}" .
      - name: Run release gate
        run: >-
          docker run --rm
          --env "EXPECTED_MACHINE=${{ matrix.machine }}"
          --env "NAD_CI_TEST_TIMEOUT_MS=${{ matrix.test_timeout_ms }}"
          --env "NAD_CI_HOOK_TIMEOUT_MS=${{ matrix.hook_timeout_ms }}"
          "nad-release-gate:${{ matrix.tag }}"
      - name: Build and inspect production image
        run: |
          revision="$(git rev-parse HEAD)"
          built_at="$(git show -s --format=%cI HEAD)"
          version="$(tr -d '\r\n' < VERSION)"
          image="nad:${version}-${{ matrix.tag }}"
          docker buildx build --load --platform "${{ matrix.platform }}" --target runner --build-arg NAD_VERSION="$version" --build-arg NAD_GIT_REVISION="$revision" --build-arg NAD_BUILD_DATE="$built_at" --build-arg NAD_SOURCE_URL=https://github.com/robrolabs/nad --build-arg NAD_BUILD_PRODUCTION=1 --tag "$image" .
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "1001:1001"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$revision"
          docker run --rm --entrypoint deno "$image" --version
      - name: Scan production image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --db-repository ghcr.io/aquasecurity/trivy-db:2 --skip-version-check \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress \
            "nad:$(tr -d '\r\n' < VERSION)-${{ matrix.tag }}"
