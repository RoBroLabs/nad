services:
  nad:
    # The supported homelab path pulls the reviewed multi-architecture image.
    # Source builds use docker-compose.build.yml explicitly.
    image: ${NAD_IMAGE:-ghcr.io/robrolabs/nad:0.3.2}
    restart: unless-stopped
    ports:
      - "${NAD_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - dashboard_data:/app/data
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  dashboard_data:
    name: dashboard_data
